<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d"><title id="t">The three containers</title><desc id="d">A browser talks to the app container (FastAPI). The app uses a Redis container for the semantic cache and rate-limit counters, a Chroma container for the document index, the OpenAI API for the model, and AWS Secrets Manager for the API key when deployed. The same three containers run under Docker Compose, ECS/Fargate and Kubernetes.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1280" height="640" fill="#ffffff"/><text x="30" y="42" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#111827" text-anchor="start">The system: three containers</text><text x="30" y="68" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#4b5563" text-anchor="start">app, chroma and redis. Defined once for Compose, once for ECS/Fargate (Terraform), once for Kubernetes.</text><rect x="30.0" y="167.0" width="150" height="96" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="105" y="203.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Browser</text><text x="105" y="221.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">web UI at /</text><text x="105" y="238.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">or curl</text><rect x="270" y="130" width="420" height="282" rx="14" fill="#dcfce7" fill-opacity="0.35" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="7 5"/><text x="286" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#4b5563" text-anchor="start">app container: FastAPI + uvicorn</text><rect x="295.0" y="186.0" width="370" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="480" y="213.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">API routes + rate limit</text><text x="480" y="229.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">/ask/stream  /ask  /cost  /health</text><rect x="295.0" y="261.0" width="370" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="480" y="287.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">RAGPipeline</text><text x="480" y="305.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">cache, retrieve, agent loop, sources</text><rect x="295.0" y="336.0" width="370" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="480" y="362.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Web UI files</text><text x="480" y="380.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">frontend/ served at / (same origin)</text><rect x="790.0" y="157.0" width="220" height="96" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="900" y="193.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">redis container</text><text x="900" y="211.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">semantic cache</text><text x="900" y="228.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">rate-limit counters</text><rect x="790.0" y="297.0" width="220" height="96" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="900" y="334.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">chroma container</text><text x="900" y="352.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">index of data/*.txt</text><text x="900" y="367.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">port 8001</text><rect x="1055.0" y="157.0" width="190" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="1150" y="193.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">OpenAI API</text><text x="1150" y="211.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">gpt-4o-mini</text><text x="1150" y="228.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">embeddings</text><rect x="1055.0" y="297.0" width="190" height="96" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="1150" y="333.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">AWS Secrets Manager</text><text x="1150" y="351.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">OpenAI key (ECS)</text><text x="1150" y="368.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">via IAM task role</text><path d="M180,215 L295,215" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)"/><text x="232" y="205" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">HTTP + SSE</text><path d="M665,290 L740,290 L740,205 L790,205" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)"/><path d="M740,290 L740,345 L790,345" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)"/><path d="M480,130 L480,98 L1150,98 L1150,157" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)"/><text x="815" y="90" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">chat, embeddings, streaming</text><path d="M480,412 L480,462 L1150,462 L1150,393" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)" stroke-dasharray="7 5"/><text x="815" y="454" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">key fetched at startup; .env fallback for local development</text><text x="30" y="508" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="start">The same three containers in three environments</text><rect x="30.0" y="533.0" width="370" height="66" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="215" y="563.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Docker Compose (local)</text><text x="215" y="581.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">src/ data/ frontend/ logs/ mounted, --reload</text><rect x="440.0" y="533.0" width="400" height="66" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="640" y="563.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">ECS/Fargate (Terraform)</text><text x="640" y="581.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">one task; containers share localhost</text><rect x="880.0" y="533.0" width="370" height="66" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="1065" y="563.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Kubernetes (Minikube)</text><text x="1065" y="581.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">Deployments + Services, DNS names</text><rect x="30" y="612" width="26" height="18" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="64" y="626" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="start">calls the OpenAI API</text><rect x="222.0" y="612" width="26" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="256.0" y="626" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="start">plain code</text><rect x="348.0" y="612" width="26" height="18" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="382.0" y="626" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="start">a store</text><rect x="454.2" y="612" width="26" height="18" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="488.2" y="626" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="start">outside the app</text></svg>