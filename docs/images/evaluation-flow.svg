<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">How the evaluation works</title><desc id="d">A fixed golden set of questions is answered by the pipeline and scored on four metrics. run_eval compares the averages with a saved baseline and flags drops over 0.1. ab_test runs two pipelines that differ only in their final-answer instruction, with the cache off, and compares their scores side by side.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1280" height="600" fill="#ffffff"/><text x="30" y="42" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#111827" text-anchor="start">How answers are scored</text><text x="30" y="68" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#4b5563" text-anchor="start">Offline, never on the live request path. Two commands share the golden set and the metrics.</text><text x="30" y="94" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">Regression check</text><text x="30" y="114" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="start">python -m src.evaluation.run_eval</text><rect x="35.0" y="144.0" width="170" height="92" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="120" y="178.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">golden set</text><text x="120" y="196.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">5 questions</text><text x="120" y="213.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">+ expected files</text><rect x="285.0" y="144.0" width="250" height="92" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="410" y="179.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">RAGPipeline.answer()</text><text x="410" y="197.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">one pipeline</text><text x="410" y="212.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">use_cache=True</text><rect x="620.0" y="126.0" width="300" height="128" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="770" y="161.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">4 metrics per answer</text><text x="770" y="179.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">faithfulness (LLM judge)</text><text x="770" y="196.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">answer relevancy (LLM judge)</text><text x="770" y="213.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">context precision (code)</text><text x="770" y="230.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">context recall (LLM judge)</text><rect x="995.0" y="144.0" width="250" height="92" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="1120" y="179.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">regression.py</text><text x="1120" y="197.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">average vs saved baseline</text><text x="1120" y="212.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">drop over 0.1 = flagged</text><path d="M205,190 L285,190" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)"/><path d="M535,190 L620,190" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)"/><path d="M920,190 L995,190" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)"/><text x="30" y="314" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#111827" text-anchor="start">A/B test of two prompts</text><text x="30" y="334" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#4b5563" text-anchor="start">python -m src.evaluation.ab_test</text><rect x="35.0" y="364.0" width="170" height="92" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="120" y="398.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">golden set</text><text x="120" y="416.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">5 questions</text><text x="120" y="433.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">+ expected files</text><rect x="285.0" y="364.0" width="250" height="92" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="410" y="399.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">two pipelines, A and B</text><text x="410" y="417.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">final instruction differs</text><text x="410" y="432.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">use_cache=False</text><rect x="620.0" y="346.0" width="300" height="128" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="770" y="381.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">4 metrics per answer</text><text x="770" y="399.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">faithfulness (LLM judge)</text><text x="770" y="416.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">answer relevancy (LLM judge)</text><text x="770" y="433.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">context precision (code)</text><text x="770" y="450.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">context recall (LLM judge)</text><rect x="995.0" y="364.0" width="250" height="92" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="1120" y="399.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">side-by-side scores</text><text x="1120" y="417.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle">A against B</text><text x="1120" y="432.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">printed, nothing saved</text><path d="M205,410 L285,410" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)"/><path d="M535,410 L620,410" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)"/><path d="M920,410 L995,410" fill="none" stroke="#374151" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#a-ink)"/><text x="30" y="520" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4b5563" text-anchor="start">The cache must be off for scoring: a cached answer returns no sources, so its context precision would be 0.</text><rect x="30" y="560" width="26" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="64" y="574" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="start">plain code</text><rect x="156.0" y="560" width="26" height="18" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="190.0" y="574" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="start">scores or decides</text><rect x="328.2" y="560" width="26" height="18" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="362.2" y="574" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="start">input or output</text></svg>