<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>TrailPeak Gear Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --snow: #F2F4F3;
    --paper: #FFFFFF;
    --ink: #1B2730;
    --ink-2: #4B5963;
    --line: #D8DEDC;
    --glacier: #0F6E78;
    --glacier-ink: #FFFFFF;
    --glacier-tint: #E0EFF0;
    --ok: #2E6B47;   --ok-bg: #E4F1E8;
    --low: #8A5A00;  --low-bg: #FBF0D6;
    --out: #A12F27;  --out-bg: #F9E3E0;
    --font: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-cond: 'Barlow Semi Condensed', 'Barlow', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --snow: #0F171B; --paper: #17232A; --ink: #E7EDEF; --ink-2: #9FB0B9; --line: #2A3A44;
      --glacier: #5CC3CE; --glacier-ink: #08262B; --glacier-tint: #17343A;
      --ok: #7FD1A0; --ok-bg: #173325; --low: #F0C163; --low-bg: #3A2D10; --out: #F19B93; --out-bg: #3B1B18;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.55;
    color: var(--ink);
    background: var(--snow);
    -webkit-font-smoothing: antialiased;
  }

  .shell { display: flex; flex-direction: column; height: 100dvh; }

  /* ---------- top bar ---------- */
  .bar {
    flex: none;
    display: flex; align-items: center; gap: 14px;
    padding: 12px max(20px, env(safe-area-inset-left)) 12px max(20px, env(safe-area-inset-right));
    border-bottom: 1px solid var(--line);
    background: var(--snow);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .blaze { width: 12px; height: 26px; border-radius: 3px; background: var(--glacier); flex: none; }
  .brand b { font-family: var(--font-cond); font-weight: 700; font-size: 22px; letter-spacing: .2px; line-height: 1; }
  .brand span { color: var(--ink-2); font-size: 15px; padding-left: 10px; border-left: 1px solid var(--line); line-height: 1; }
  .status { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; color: var(--ink-2); }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-2); opacity: .5; }
  .status[data-state="up"] i { background: var(--ok); opacity: 1; }
  .status[data-state="down"] i { background: var(--out); opacity: 1; }
  .status[data-state="demo"] i { background: var(--low); opacity: 1; }
  .btn-quiet {
    font: inherit; font-size: 15px; font-weight: 500; color: var(--ink);
    background: transparent; border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 12px; min-height: 36px; cursor: pointer;
  }
  .btn-quiet:hover { background: var(--paper); }

  /* ---------- conversation ---------- */
  #log { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .col { width: 100%; max-width: 760px; margin: 0 auto; padding: 28px 20px 12px; }

  .hello { padding-top: min(9vh, 72px); }
  .hello h1 { text-wrap: balance; font-family: var(--font-cond); font-weight: 700; font-size: clamp(34px, 6vw, 52px); line-height: 1.02; letter-spacing: -.2px; margin: 0 0 10px; }
  .hello p { margin: 0; color: var(--ink-2); max-width: 46ch; font-size: 18px; }
  .ideas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-top: 40px; }
  .ideas h2 { font-family: var(--font-cond); font-weight: 600; font-size: 17px; margin: 0 0 8px; color: var(--ink-2); }
  .ideas ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .idea {
    width: 100%; text-align: left; font: inherit; font-size: 16px; line-height: 1.35; color: var(--ink);
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 13px; cursor: pointer; min-height: 48px;
    transition: border-color .12s, transform .12s;
  }
  .idea:hover { border-color: var(--glacier); }
  .idea:active { transform: translateY(1px); }

  .turn { margin: 0 0 30px; }
  .you { display: flex; justify-content: flex-end; }
  .you p {
    margin: 0; max-width: 85%; background: var(--ink); color: var(--snow);
    padding: 9px 14px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .desk { position: relative; margin-top: 16px; padding-left: 22px; }
  .desk::before { /* the blaze marks every answer from the desk */
    content: ""; position: absolute; left: 0; top: 3px; width: 6px; height: 20px; border-radius: 2px; background: var(--glacier);
  }

  /* how the answer was found: a short trail of steps */
  .trail { list-style: none; margin: 0 0 14px; padding: 0; font-size: 15px; color: var(--ink-2); }
  .trail li { position: relative; padding: 0 0 8px 22px; }
  .trail li:last-child { padding-bottom: 0; }
  .trail li::before { content: ""; position: absolute; left: 4px; top: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--glacier); }
  .trail li::after { content: ""; position: absolute; left: 8px; top: 20px; bottom: -4px; border-left: 2px dotted var(--line); }
  .trail li:last-child::after { display: none; }
  .trail li[data-state="running"]::before { background: transparent; border: 2px solid var(--glacier); animation: pulse 1s ease-in-out infinite; }
  .trail strong { color: var(--ink); font-weight: 600; }
  .trail code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: var(--ink); }
  @keyframes pulse { 50% { opacity: .35; } }

  .answer > :first-child { margin-top: 0; }
  .answer p { margin: 0 0 12px; }
  .answer ul, .answer ol { margin: 0 0 12px; padding-left: 22px; }
  .answer li { margin-bottom: 5px; }
  .answer strong { font-weight: 600; }
  .answer code { font-family: ui-monospace, Menlo, monospace; font-size: .88em; background: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
  .caret { display: inline-block; width: 8px; height: 1.05em; margin-left: 3px; vertical-align: -3px; background: var(--glacier); border-radius: 2px; animation: pulse 1s steps(2) infinite; }

  /* product hang tags: the live-inventory result, shown as a tag on the gear */
  .tags { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin: 4px 0 14px; }
  .tag {
    position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px 12px 44px;
  }
  .tag::before { /* punched hole */
    content: ""; position: absolute; left: 14px; top: 16px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--snow); box-shadow: inset 0 0 0 2px var(--ink-2), inset 0 2px 3px rgba(0,0,0,.18);
  }
  .tag h3 { margin: 0; font-family: var(--font-cond); font-size: 19px; font-weight: 700; line-height: 1.15; }
  .tag .sku { font-size: 13px; color: var(--ink-2); font-family: ui-monospace, Menlo, monospace; }
  .tag .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .tag .price { font-family: var(--font-cond); font-weight: 700; font-size: 26px; line-height: 1; }
  .pill { font-size: 13.5px; font-weight: 600; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .pill.ok { color: var(--ok); background: var(--ok-bg); }
  .pill.low { color: var(--low); background: var(--low-bg); }
  .pill.out { color: var(--out); background: var(--out-bg); }
  .tag .sizes { margin: 8px 0 0; font-size: 14px; color: var(--ink-2); }

  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; font-size: 14px; color: var(--ink-2); }
  .src { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--glacier-tint); color: var(--ink); border-radius: 6px; padding: 2px 8px; }
  .mini { font: inherit; font-size: 14px; color: var(--ink-2); background: none; border: 0; padding: 4px 6px; border-radius: 6px; cursor: pointer; min-height: 32px; }
  .mini:hover { color: var(--ink); background: var(--paper); }
  .notice { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--out-bg); color: var(--out); font-size: 16px; }
  .notice button { font: inherit; font-weight: 600; color: inherit; background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 0 0 0 6px; }

  /* ---------- composer ---------- */
  .composer { flex: none; padding: 10px 20px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--snow) 70%, transparent); }
  .composer form {
    max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 16px;
  }
  .composer form:focus-within { border-color: var(--glacier); box-shadow: 0 0 0 3px var(--glacier-tint); }
  textarea {
    flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: var(--ink);
    font: inherit; font-size: 17px; line-height: 1.45; padding: 8px 0; max-height: 8.5em; min-height: 2.2em;
  }
  textarea::placeholder { color: var(--ink-2); opacity: .8; }
  .go {
    flex: none; width: 44px; height: 44px; border-radius: 12px; border: 0; cursor: pointer;
    background: var(--glacier); color: var(--glacier-ink); display: grid; place-items: center;
  }
  .go:disabled { background: var(--line); color: var(--ink-2); cursor: not-allowed; }
  .go svg { width: 20px; height: 20px; }
  .fine { max-width: 760px; margin: 8px auto 0; font-size: 13.5px; color: var(--ink-2); text-align: center; }

  :focus-visible { outline: 3px solid var(--glacier); outline-offset: 2px; }
  textarea:focus-visible { outline: 0; }

  @media (max-width: 720px) {
    body { font-size: 16.5px; }
    .brand span, .status span { display: none; }
    .ideas { grid-template-columns: 1fr; gap: 20px; margin-top: 28px; }
    .col { padding-top: 20px; }
    .tags { grid-template-columns: 1fr; }
    .you p { max-width: 92%; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <div class="brand"><i class="blaze" aria-hidden="true"></i><b>TrailPeak</b><span>Gear desk</span></div>
    <div class="status" id="status" data-state="idle" role="status"><i aria-hidden="true"></i><span id="status-text">Connecting</span></div>
    <button class="btn-quiet" id="new-chat" type="button">New chat</button>
  </header>

  <main id="log" role="log" aria-live="polite" aria-label="Conversation">
    <div class="col" id="col">
      <section class="hello" id="hello">
        <h1>What are you gearing up for?</h1>
        <p>Ask about products, live stock and prices, shipping, returns or warranty. Every answer shows where it came from.</p>
        <div class="ideas">
          <div>
            <h2>Gear</h2>
            <ul>
              <li><button class="idea" type="button">Which tent works for winter camping?</button></li>
              <li><button class="idea" type="button">What is the warmest sleeping bag you sell?</button></li>
            </ul>
          </div>
          <div>
            <h2>Stock and price</h2>
            <ul>
              <li><button class="idea" type="button">Is the SummitCarry backpack in stock, and what does it cost?</button></li>
              <li><button class="idea" type="button">How much would the StormShield jacket and TrekLight poles cost together?</button></li>
            </ul>
          </div>
          <div>
            <h2>Policies</h2>
            <ul>
              <li><button class="idea" type="button">What is your return policy?</button></li>
              <li><button class="idea" type="button">How does the warranty work?</button></li>
            </ul>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div class="composer">
    <form id="form" autocomplete="off">
      <label for="q" hidden>Your question</label>
      <textarea id="q" rows="1" placeholder="Ask about gear, stock or returns" enterkeyhint="send"></textarea>
      <button class="go" id="go" type="submit" aria-label="Send question">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 16V4M4.5 9.5 10 4l5.5 5.5"/></svg>
      </button>
    </form>
    <p class="fine">Answers come from TrailPeak documents and live inventory. Check the sources before you buy.</p>
  </div>
</div>

<script>
(() => {
  // ---- where the API lives -------------------------------------------------
  // This page is served by the FastAPI app itself -> same origin, so API is ''.
  // ?api=http://host:8000 points it at another server (that server then needs CORS_ORIGINS set).
  // ?demo plays scripted answers, so the design can be viewed without a backend.
  const params = new URLSearchParams(location.search);
  const API = params.get('api') ?? '';
  const DEMO = params.has('demo');

  const $ = (id) => document.getElementById(id);
  const col = $('col'), log = $('log'), form = $('form'), q = $('q'), go = $('go');
  const ICON_SEND = go.innerHTML;
  const ICON_STOP = '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="10" height="10" rx="2"/></svg>';

  let busy = false, controller = null;

  // ---- tiny, safe markdown: paragraphs, bullets, numbers, bold, code -------
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
  function markdown(raw) {
    const out = []; let list = null;
    const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
    for (const line of raw.split('\n')) {
      const t = line.trim();
      let m;
      if ((m = t.match(/^[-*]\s+(.*)/))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(m[1])}</li>`); }
      else if ((m = t.match(/^\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inline(m[1])}</li>`); }
      else { close(); if (t) out.push(`<p>${inline(t)}</p>`); }
    }
    close();
    return out.join('');
  }

  const withCaret = (html) => html.replace(/<\/(p|li)>(?![\s\S]*<\/(p|li)>)/, '<span class="caret"></span></$1>');

  // ---- building one turn ---------------------------------------------------
  function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

  function startTurn(question) {
    $('hello')?.remove();
    const turn = el('article', 'turn');
    turn.append(el('div', 'you', `<p>${esc(question)}</p>`));
    const desk = el('div', 'desk');
    const trail = el('ol', 'trail'); trail.hidden = true;
    const tags = el('div', 'tags'); tags.hidden = true;
    const answer = el('div', 'answer live');
    const meta = el('div', 'meta'); meta.hidden = true;
    desk.append(trail, answer, tags, meta);
    turn.append(desk);
    col.append(turn);
    scroll();
    return { turn, desk, trail, tags, answer, meta, text: '', steps: new Map(), skus: new Set() };
  }

  function step(t, s) {
    t.trail.hidden = false;
    let li = t.steps.get(s.id);
    if (!li) { li = el('li'); t.steps.set(s.id, li); t.trail.append(li); }
    li.dataset.state = s.status;
    const detail = s.detail ? ` <code>${esc(s.detail)}</code>` : '';
    li.innerHTML = `<strong>${esc(s.label)}</strong>${detail}`;
  }

  function product(t, p) {
    if (t.skus.has(p.sku)) return;
    t.skus.add(p.sku); t.tags.hidden = false;
    const state = p.stock === 0 ? ['out', 'Out of stock'] : p.stock <= 5 ? ['low', `Only ${p.stock} left`] : ['ok', 'In stock'];
    t.tags.append(el('div', 'tag', `
      <h3>${esc(p.name)}</h3><div class="sku">${esc(p.sku)}</div>
      <div class="row"><span class="price">$${Number(p.price).toFixed(2)}</span><span class="pill ${state[0]}">${state[1]}</span></div>
      <p class="sizes">Sizes: ${esc(p.sizes.join(', '))}</p>`));
  }

  function finish(t, info = {}) {
    t.answer.classList.remove('live');
    if (t.text) t.answer.innerHTML = markdown(t.text);   // final render, no typing caret
    t.trail.querySelectorAll('li[data-state="running"]').forEach((li) => (li.dataset.state = 'done'));
    t.meta.hidden = false; t.meta.innerHTML = '';
    if (info.sources?.length) { t.meta.append(document.createTextNode('Sources')); info.sources.forEach((s) => t.meta.append(el('span', 'src', esc(s)))); }
    if (info.cached) t.meta.append(el('span', null, 'Saved answer'));
    const copy = el('button', 'mini', 'Copy'); copy.type = 'button';
    copy.onclick = async () => { try { await navigator.clipboard.writeText(t.text); copy.textContent = 'Copied'; setTimeout(() => (copy.textContent = 'Copy'), 1500); } catch {} };
    t.meta.append(copy);
  }

  function fail(t, message, retry) {
    t.answer.classList.remove('live');
    const n = el('p', 'notice', esc(message)); n.setAttribute('role', 'alert');
    if (retry) { const b = el('button', null, 'Try again'); b.type = 'button'; b.onclick = () => { t.turn.remove(); ask(retry); }; n.append(b); }
    t.answer.replaceChildren(n);
  }

  const scroll = () => { log.scrollTop = log.scrollHeight; };

  // ---- one question ----------------------------------------------------------
  async function ask(question) {
    if (busy || !question.trim()) return;
    busy = true; controller = new AbortController();
    go.innerHTML = ICON_STOP; go.setAttribute('aria-label', 'Stop answering'); go.disabled = false;
    const t = startTurn(question);
    try {
      const events = DEMO ? demoStream(question, controller.signal) : liveStream(question, controller.signal);
      for await (const { event, data } of events) {
        if (event === 'step') step(t, data);
        else if (event === 'product') product(t, data);
        else if (event === 'token') { t.text += data.t; t.answer.innerHTML = withCaret(markdown(t.text)); }
        else if (event === 'error') throw Object.assign(new Error(data.message), { friendly: true });
        else if (event === 'done') finish(t, data);
        scroll();
      }
      if (t.answer.classList.contains('live')) finish(t, {});
    } catch (err) {
      if (err.name === 'AbortError') { t.text ? finish(t, {}) : fail(t, 'Stopped.', null); }
      else if (err.status === 429) fail(t, 'You are asking faster than the desk can answer. Wait a moment and try again.', question);
      else fail(t, err.friendly ? err.message : 'Could not reach the gear desk.', t.text ? null : question);
    } finally {
      busy = false; controller = null;
      go.innerHTML = ICON_SEND; go.setAttribute('aria-label', 'Send question'); go.disabled = !q.value.trim();
      q.focus({ preventScroll: true });
    }
  }

  // ---- real backend: Server-Sent Events, parsed properly -----------------------
  async function* liveStream(question, signal) {
    const res = await fetch(`${API}/ask/stream`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: question }), signal,
    });
    if (!res.ok) throw Object.assign(new Error(`HTTP ${res.status}`), { status: res.status });
    const reader = res.body.getReader(), decoder = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });     // keep half-received events for the next chunk
      let i;
      while ((i = buf.indexOf('\n\n')) !== -1) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        let event = 'message', data = '';
        for (const line of block.split('\n')) {
          if (line.startsWith('event: ')) event = line.slice(7);
          else if (line.startsWith('data: ')) data += line.slice(6);
        }
        if (data) yield { event, data: JSON.parse(data) };
      }
    }
  }

  // ---- scripted answers so the design can be judged without a backend --------
  const sleep = (ms, signal) => new Promise((ok, no) => {
    const id = setTimeout(ok, ms);
    signal.addEventListener('abort', () => { clearTimeout(id); no(Object.assign(new Error('aborted'), { name: 'AbortError' })); }, { once: true });
  });
  const INV = {
    jacket: { sku: 'TP-JKT-001', name: 'StormShield Rain Jacket', price: 189, stock: 34, sizes: ['XS', 'S', 'M', 'L', 'XL', 'XXL'] },
    poles:  { sku: 'TP-POLE-006', name: 'TrekLight Trekking Poles', price: 89, stock: 58, sizes: ['One Size'] },
    pack:   { sku: 'TP-PCK-003', name: 'SummitCarry 65L Backpack', price: 249, stock: 0, sizes: ['S/M', 'M/L'] },
    lamp:   { sku: 'TP-LAMP-009', name: 'NightWatch Headlamp', price: 34, stock: 4, sizes: ['One Size'] },
  };
  const SCRIPTS = [
    { match: /summitcarry|backpack|in stock/i, steps: [['s1', 'Searched store documents', 'product_catalog.txt'], ['s2', 'Checked live stock', 'TP-PCK-003']], products: ['pack'],
      sources: ['product_catalog.txt'],
      text: 'The **SummitCarry 65L Backpack** is **out of stock** right now. It is listed at **$249.00**.\n\nIt is a 65L multi-day pack, so it suits 3-5 day trips. If you need a pack sooner, ask me about our other packs and I will check their stock.' },
    { match: /together|jacket.*poles|total/i, steps: [['s1', 'Searched store documents', 'product_catalog.txt'], ['s2', 'Checked live price', 'TP-JKT-001'], ['s3', 'Checked live price', 'TP-POLE-006'], ['s4', 'Added the prices', '$189.00 + $89.00 = $278.00']], products: ['jacket', 'poles'],
      sources: ['product_catalog.txt'],
      text: 'The **StormShield Rain Jacket** ($189.00) and the **TrekLight Trekking Poles** ($89.00) come to **$278.00** together, before shipping and tax.\n\nBoth are in stock.' },
    { match: /return/i, steps: [['s1', 'Searched store documents', 'returns_policy.txt']], products: [],
      sources: ['returns_policy.txt'],
      text: 'Most items can be returned within **30 days of delivery** for a full refund.\n\n- Items must be unused, with original tags and packaging.\n- Opened water filters, base layers and Final Sale items cannot be returned.\n- A $7.99 return shipping fee is deducted unless your order shipped free.\n\nRefunds are processed within 3-5 business days after we receive the item.' },
    { match: /warranty/i, steps: [['s1', 'Searched store documents', 'warranty_policy.txt']], products: [],
      sources: ['warranty_policy.txt'],
      text: 'Defective items are covered by the warranty even after the 30-day return window, and even if they show signs of use.\n\nYou will need proof of purchase. An order confirmation or an account order history both work.' },
    { match: /./, steps: [['s1', 'Searched store documents', 'product_catalog.txt']], products: [],
      sources: ['product_catalog.txt'],
      text: 'We do not have a winter-rated tent. The **AlpinePeak 2-Person Tent** is a 3-season tent and is not rated for heavy snow load.\n\nFor winter trips, the **CloudNine Sleeping Bag** is rated to 20F, which suits cold shoulder-season nights.' },
  ];
  async function* demoStream(question, signal) {
    const s = SCRIPTS.find((x) => x.match.test(question));
    for (const [id, label, detail] of s.steps) {
      yield { event: 'step', data: { id, label, detail, status: 'running' } }; await sleep(520, signal);
      yield { event: 'step', data: { id, label, detail, status: 'done' } };
    }
    for (const k of s.products) { yield { event: 'product', data: INV[k] }; await sleep(150, signal); }
    for (const piece of s.text.match(/\S+\s*|\n+/g)) { yield { event: 'token', data: { t: piece } }; await sleep(24, signal); }
    yield { event: 'done', data: { sources: s.sources, cached: false } };
  }

  // ---- wiring ------------------------------------------------------------------
  function grow() { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 140) + 'px'; go.disabled = !busy && !q.value.trim(); }
  q.addEventListener('input', grow);
  q.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (busy) { controller?.abort(); return; }
    const text = q.value.trim(); if (!text) return;
    q.value = ''; grow(); ask(text);
  });
  document.querySelectorAll('.idea').forEach((b) => b.addEventListener('click', () => ask(b.textContent.trim())));
  $('new-chat').addEventListener('click', () => { controller?.abort(); location.reload(); });

  const status = $('status'), statusText = $('status-text');
  function setStatus(state, text) { status.dataset.state = state; statusText.textContent = text; }
  if (DEMO) setStatus('demo', 'Demo answers');
  else fetch(`${API}/health`).then((r) => (r.ok ? setStatus('up', 'Connected') : setStatus('down', 'Unavailable'))).catch(() => setStatus('down', 'Unavailable'));
  grow();
})();
</script>
</body>
