version: "3.9"
services:
  app:
    build:
      context: .
      dockerfile: infra/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8001
    depends_on:
      - chroma
      - redis
    env_file:
      - .env

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8001"
    volumes:
      - chroma_data:/chroma/chroma
    command: "run --host 0.0.0.0 --port 8001 --path /chroma/chroma"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  chroma_data: